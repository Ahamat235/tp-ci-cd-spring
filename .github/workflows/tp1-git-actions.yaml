name: TP1- GitHub Actions
run-name: ${{ github.actor }} is testing out GitHub Actions 🚀
on: # si on met [push] le workflow se déclenche à chaque push sur n'importe quelle branche
    push:
        branches:
        - master

jobs:
    build:
    runs-on: ubuntu-latest
    steps:
      # etape1 : recuperer le code du repo
      - name: Checkout repository
        uses: actions/checkout@v3

        # etape2 : installer les dependances
      - name: configuration de java 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: compilation du projet
        run: mvn clean package
      - run: echo "Compilation terminée avec succès !"